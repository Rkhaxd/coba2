<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Desain - Rkhax Porto</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      overflow-x: hidden;
      position: relative;
    }

    /* Background animasi sama seperti sebelumnya */
    body::before {
      content: "";
      position: absolute;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        45deg,
        #000000,
        #1a0000,
        #330000,
        #660000,
        #000000
      );
      animation: gradientMove 10s ease infinite;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { transform: translate(0%, 0%); }
      50% { transform: translate(-30%, -30%); }
      100% { transform: translate(0%, 0%); }
    }

    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, transparent 70%);
      z-index: -1;
    }

    h1 {
      margin: 40px 0;
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 0 0 15px red;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .gallery img {
      width: 250px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #ff2e2e;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px red;
    }

    /* Tombol kembali */
    .back {
      padding: 10px 20px;
      border: 2px solid #ff2e2e;
      color: #ff2e2e;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 30px;
    }

    .back:hover {
      background: #ff2e2e;
      color: black;
      box-shadow: 0 0 15px red;
    }

  </style>
</head>
<body>

  <h1>Desain</h1>

  <div class="gallery">
    <img src="https://picsum.photos/400/300?random=1">
    <img src="https://picsum.photos/400/300?random=2">
    <img src="https://picsum.photos/400/300?random=3">
    <img src="https://picsum.photos/400/300?random=4">
    <img src="https://picsum.photos/400/300?random=5">
  </div>

  <button class="back" onclick="window.location.href='po.html'">
    Kembali
  </button>

</body>
</html>
